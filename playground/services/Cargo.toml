[workspace]
members = [
    "hello",
    "counter",
    "peek",
    "zero",
    "poke",
    "gas",
    "peek",
    "is_available",
    "expunge",
    "machine",
    "machineNexpunge",
    "machineNzeroNvoid",
    "void",
    "create_service",
]

resolver = "2"

[workspace.dependencies]
jam-types = { version = "0.1.22", default-features = false }
jam-pvm-common = { version = "0.1.22", features = [
    "service",
    "logging",
], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
types = { path = "../../types" }

[workspace.package]
authors = ["Chainscore Labs"]
license = "MIT"
